name: Make video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode (script or video)'
        required: true
        default: 'video'
      topic:
        description: 'Topic for the video'
        required: true
        default: 'The Mahindra story in Hindi'
      scenes:
        description: 'Number of scenes'
        required: true
        default: '24'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python make_video.py "${{ github.event.inputs.mode }}" "${{ github.event.inputs.topic }}"

      - name: Save changes to the repo
        run: |
          git config --global user.name "video-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git pull --rebase
          git add script.json audio/ images/
          git diff-index --quiet HEAD || git commit -m "Auto-commit audio and visuals"
          git push
