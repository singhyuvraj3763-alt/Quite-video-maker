name: Make video

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = topic to finished video. script = script only. video = render from script.json'
        type: choice
        options:
          - full
          - script
          - video
        default: full
      topic:
        description: 'Topic, e.g. The Mahindra story in Hindi'
        type: string
        required: false
        default: 'The Mahindra story in Hindi'
      scenes:
        description: 'Number of scenes'
        type: string
        default: '24'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-deva

      - name: Install Python packages
        run: pip install requests edge-tts gTTS Pillow

      - name: Syntax check
        run: python -m py_compile make_video.py

      - name: Make the video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          TOPIC: ${{ inputs.topic || 'The Mahindra story in Hindi' }}
          SCENES: ${{ inputs.scenes || '24' }}
          MODE: ${{ inputs.mode || 'full' }}
        run: python make_video.py "$MODE"

      - name: Save script
        if: ${{ inputs.mode == 'script' }}
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add script.json
          git commit -m "Update script" || echo "No changes"
          git push

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ inputs.mode || 'full' }}
          path: out/
          if-no-files-found: ignore
