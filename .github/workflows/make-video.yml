name: Make Video Pipeline

on:
  workflow_dispatch:
    inputs:
      language:
        description: 'Select Language'
        required: true
        default: 'hi'
        type: choice
        options:
          - hi
          - en
      topic:
        description: 'Video Topic'
        required: true
        default: 'The history of Marwar'
      scenes:
        description: 'Number of Scenes'
        required: true
        default: '24'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core

      - name: Install Python Packages
        run: |
          pip install --upgrade pip
          pip install requests pillow edge-tts gTTS

      - name: Verify Script Syntax
        run: |
          python -m py_compile make_video.py

      - name: Run Video Automation Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC: ${{ github.event.inputs.topic || 'The history of Marwar' }}
          LANGUAGE: ${{ github.event.inputs.language || 'hi' }}
          SCENES: ${{ github.event.inputs.scenes || '24' }}
        run: |
          python make_video.py full

      - name: Upload Final Video
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentary-video-${{ github.event.inputs.language || 'hi' }}
          path: out/final.mp4
          retention-days: 7
          
