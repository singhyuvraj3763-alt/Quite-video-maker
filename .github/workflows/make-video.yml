name: Make video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Enter Video Topic'
        required: true
        default: 'The Mahindra story in Hindi'
      scenes:
        description: 'Number of scenes'
        required: true
        default: '24'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python make_video.py "${{ github.event.inputs.topic }}" "${{ github.event.inputs.scenes }}"

      - name: Save generated script to repository
        run: |
          git config --global user.name "video-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git pull --rebase
          git add script.json
          git diff-index --quiet HEAD || git commit -m "Auto-generate script for ${{ github.event.inputs.topic }}"
          git push

      - name: Upload Final Video
        uses: actions/upload-artifact@v4
        with:
          name: final-documentary-video
          path: final_documentary.mp4
          retention-days: 7
