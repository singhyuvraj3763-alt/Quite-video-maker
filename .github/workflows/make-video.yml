name: Make Documentary Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic (keep the SAME for every part)"
        required: true
        default: "History of England"
      part:
        description: "Which part is this? (1, 2, 3...)"
        required: true
        default: "1"
      total_parts:
        description: "How many parts in total? (1 = single video)"
        required: true
        default: "1"
      part_focus:
        description: "What THIS part covers (recommended for series)"
        required: false
        default: ""
      language:
        description: "hi or en"
        required: true
        default: "hi"
      scenes:
        description: "Number of scenes (3 images each)"
        required: true
        default: "15"
      style:
        description: "Image style line (optional)"
        required: false
        default: ""
      resume:
        description: "Resume a previous run? (1 = yes, leave empty = no)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core

      - name: Install Python packages
        run: pip install requests pillow edge-tts gTTS

      - name: Build video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          TOPIC: ${{ github.event.inputs.topic }}
          PART: ${{ github.event.inputs.part }}
          TOTAL_PARTS: ${{ github.event.inputs.total_parts }}
          PART_FOCUS: ${{ github.event.inputs.part_focus }}
          LANGUAGE: ${{ github.event.inputs.language }}
          SCENES: ${{ github.event.inputs.scenes }}
          RESUME: ${{ github.event.inputs.resume }}
        run: |
          if [ -n "${{ github.event.inputs.style }}" ]; then
            export STYLE="${{ github.event.inputs.style }}"
          fi
          python make_video.py full

      - name: Upload video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentary-video-part-${{ github.event.inputs.part }}
          path: |
            out/
            script.json
