name: Make video

on:
  # 1) Tap "Run workflow" and type a topic
  workflow_dispatch:
    inputs:
      mode:
        description: "full = topic to finished video in one go. script = script only. video = render from saved script.json"
        type: choice
        options:
          - full
          - script
          - video
        default: full
      topic:
        description: "Topic, e.g. The Mahindra story"
        type: string
        required: false
      scenes:
        description: "Number of scenes (24 is about 8-10 minutes)"
        type: string
        default: "24"
  # 2) Or edit topic.txt in the repository and commit: a video starts automatically
  push:
    paths:
      - topic.txt

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: pip install requests edge-tts gTTS Pillow

      - name: Preflight check (fails early with a clear message)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          MODE: ${{ inputs.mode || 'full' }}
        run: |
          python - <<'PY'
          import importlib, os, shutil, sys
          problems = []
          for mod in ("requests", "edge_tts", "gtts", "PIL"):
              try:
                  importlib.import_module(mod)
              except Exception as e:
                  problems.append(f"Python package missing: {mod} ({e})")
          for tool in ("ffmpeg", "ffprobe"):
              if not shutil.which(tool):
                  problems.append(f"{tool} is not installed")
          if os.environ["MODE"] in ("full", "script") and not os.environ.get("GEMINI_API_KEY"):
              problems.append("Secret GEMINI_API_KEY is missing or empty")
          if os.environ["MODE"] in ("full", "video") and not os.environ.get("POLLINATIONS_API_KEY"):
              print("WARNING: POLLINATIONS_API_KEY is empty. Images will be slow and may fail.")
          if problems:
              print("PREFLIGHT FAILED:")
              for p in problems:
                  print(" -", p)
              sys.exit(1)
          print("Preflight OK")
          PY

      - name: Run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          TOPIC: ${{ inputs.topic }}
          SCENES: ${{ inputs.scenes || '24' }}
          MODE: ${{ inputs.mode || 'full' }}
        run: python make_video.py "$MODE"

      - name: Save script.json to the repo
        if: ${{ inputs.mode == 'script' }}
        run: |
          git config user.name "video-bot"
          git config user.email "video-bot@users.noreply.github.com"
          git add script.json
          git commit -m "Update script" || echo "No changes to commit"
          git push

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ inputs.mode || 'full' }}
          path: out/
